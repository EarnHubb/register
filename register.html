<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velora Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#090513;
    display:flex;
    justify-content:center;
    padding:20px;
    color:#fff;
}

.container{
    width:390px;
    max-width:100%;
    background:linear-gradient(180deg,#17102b,#0a0616);
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 30px rgba(126,72,255,.3);
}

.title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:20px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    letter-spacing:1px;
    color:#d6d6d6;
    margin-bottom:8px;
    margin-top:18px;
}

input,select{
    width:100%;
    height:55px;
    border:none;
    outline:none;
    border-radius:15px;
    background:#5d5868;
    color:#fff;
    padding:0 16px;
    font-size:18px;
}

input::placeholder{
    color:#ececec;
}

.phone{
    display:flex;
    gap:10px;
}

.phone select{
    width:42%;
}

.phone input{
    width:58%;
}

.country{
    margin-top:8px;
    color:#d6d6d6;
    font-size:17px;
}

.password-box{
    position:relative;
}

.eye{
    position:absolute;
    right:18px;
    top:17px;
    cursor:pointer;
    font-size:22px;
}

.link{
    margin-top:12px;
    font-size:16px;
}

.link a{
    color:#9f70ff;
    text-decoration:none;
    font-weight:bold;
}

.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:20px;
    font-size:16px;
}

.checkbox input{
    width:20px;
    height:20px;
}

.checkbox a{
    color:#8d63ff;
    text-decoration:none;
}

button{
    width:100%;
    height:55px;
    border:none;
    border-radius:15px;
    margin-top:25px;
    background:#7c4dff;
    color:#fff;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#6a38ff;
}
</style>

</head>
<body>

<div class="container">

<div class="title">Velora Registration</div>

<label>FULL NAME</label>
<input type="text" placeholder="Full Name">

<label>EMAIL ADDRESS</label>
<input type="email" placeholder="Email">

<label>USERNAME</label>
<input type="text" placeholder="Username">

<label>PASSWORD</label>

<div class="password-box">
<input type="password" id="password" placeholder="Password">
<span class="eye" onclick="togglePassword()">👁️</span>
</div>

<label>PHONE NUMBER</label>

<div class="phone">
<select>
<option>+234 - Nigeria</option>
<option>+237 - Cameroon</option>
<option>+233 - Ghana</option>
</select>

<input type="tel" placeholder="Phone Number">
</div><br>

<input type="text" id="accessKey" placeholder="Enter/Paste Access Key">
<div class="link">
Don't have a key
<a href="https://wa.me/234
9044638903?text=Hello%2C%20please%20I%20want%20to%20get%20a%20Velora%20Access%20Key." target="_blank">
Velora Access Key? Click here
</a>
</div>
<label>PACKAGE</label>

<select>
    
<option>SILVER PLAN - ₦9,000</option>
<option>GOLD PLAN - ₦14,500</option>
</select>

<label>REFEREE</label>

<input type="text" placeholder="Referred by">

<div class="checkbox">
<input type="checkbox">
<span>I agree to the <a href="#">Terms</a></span>
</div>

<button type="button" onclick="validateAccessKey()">
    Create Account
</button>

</div>

<script>
function togglePassword(){
const pass=document.getElementById("password");

if(pass.type==="password"){
pass.type="text";
}else{
pass.type="password";
}
}
</script>
    <script>
function validateAccessKey() {
    const accessKey = document.getElementById("accessKey").value.trim();

    // Correct Access Key
    const validKey = "V19370425";

    if (accessKey === "") {
        alert("Please enter your Velora Access Key.");
        return;
    }

    if (accessKey !== validKey) {
        alert("Invalid Access Key! Please enter a valid Velora Access Key.");
        return;
    }

    // Access Key is correct
    window.open("https://earnhubb.github.io/packages/packages", "_blank");
}
    </script>
</body>
</html>
